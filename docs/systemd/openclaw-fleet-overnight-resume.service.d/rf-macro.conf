[Service]
# Risk-free epoch (2026-09-06, spec docs/specs/2026-09-04-options-surface-cboe-oi-rf-calendar-spec.md Part C).
# The fleet re-backtest that started 2026-09-06 runs under the macro (FRED DGS3MO)
# risk-free rate so every canonical row carries config_json.rf.source='macro'
# BEFORE the live flag flips. EnvironmentFile (.env) wins over Environment=,
# so once .env sets OPENCLAW_RF_SOURCE this line is inert — scripts/
# rf_flip_after_fleet.sh removes it at flip time so a later .env rollback to
# 'const' cannot leave the fleet silently on 'macro'.
Environment=OPENCLAW_RF_SOURCE=macro
