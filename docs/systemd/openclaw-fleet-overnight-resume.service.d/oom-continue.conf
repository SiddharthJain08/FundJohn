[Service]
# One heavy strategy OOMing must not kill the whole night (2026-07-22:
# S_pairs_trading_jump_diffusion_intraday hit 3.9G at 1h42m; default
# OOMPolicy=stop took down the driver and the other 39 strategies never ran).
# continue = the kernel kills the offending python child, the node driver
# logs FAIL and moves to the next strategy.
OOMPolicy=continue
