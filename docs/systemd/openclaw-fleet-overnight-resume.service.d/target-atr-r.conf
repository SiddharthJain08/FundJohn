[Service]
# Target-geometry epoch (2026-09-10). The fleet re-backtest runs under
# OPENCLAW_TARGET_MODE=atr_r (BaseStrategy targets = R-multiples of the ATR stop)
# so every canonical row carries config_json.target_mode='atr_r' BEFORE the live
# flag flips. EnvironmentFile (.env) wins over Environment=, so once .env sets
# OPENCLAW_TARGET_MODE this line is inert — scripts/target_mode_flip_after_fleet.sh
# removes it at flip time so a later .env rollback to 'flat' cannot leave the
# fleet silently on 'atr_r'.
Environment=OPENCLAW_TARGET_MODE=atr_r
