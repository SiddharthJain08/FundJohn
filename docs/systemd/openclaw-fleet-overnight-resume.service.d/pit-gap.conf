[Service]
# Point-in-time / gap-fill epoch (20261025). The fleet re-backtest reads only filed fundamentals,
# fills gapped stops at the open and reads macro series only after their release lag.
# EnvironmentFile (.env) wins over Environment=; .env must NOT define these flags. Removed at flip time by
# scripts/pit_gap_flip_after_fleet.sh, or by hand:  scripts/epoch_pit_gap.sh uninstall --date 20261025 --run
Environment="OPENCLAW_FINANCIALS_PIT=1" "OPENCLAW_BT_GAP_FILL=open" "OPENCLAW_MACRO_PIT=1"
