[Service]
# Backtest universe parity epoch (20261007). The fleet re-backtest bounds each strategy's universe by its
# manifest universe_filter_ref so every canonical row carries config_json.universe_bound_source.
# EnvironmentFile (.env) wins over Environment=; .env must NOT define OPENCLAW_BT_UNIVERSE_FILTER_REF. Remove with:
#   scripts/epoch_universe_parity.sh uninstall --date 20261007 --run
Environment="OPENCLAW_BT_UNIVERSE_FILTER_REF=1"
