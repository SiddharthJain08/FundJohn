# Drop-in override 2026-04-27: run as root to match johnbot.service (the
# 14:00 UTC daily cycle runs as root and writes data/master/*.parquet as
# root-owned files). The original `User=claudebot` setting blocked the
# EOD refresh from updating prices.parquet.lock — today's close was
# fetched but never persisted, leaving tomorrow's signals stale.
#
# This override empties the User/Group fields (= root) so the EOD
# refresh shares root's write access to the parquet store.
[Service]
User=
Group=
