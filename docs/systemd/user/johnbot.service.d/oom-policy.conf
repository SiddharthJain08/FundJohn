# 2026-07-14: fused-approval children (wide-universe unified_backtest,
# strategycoder) can be OOM-killed on the 8GB no-swap box. Default
# OOMPolicy=stop made systemd kill the WHOLE johnbot unit whenever the
# kernel reaped one child (3 crashes on 07-13/07-14). continue = the job
# fails gracefully, the trading bot survives.
[Service]
OOMPolicy=continue
