# Weekend SWAP — operator directive 2026-07-16.
# Research work moves to SATURDAY; the actuating weekend_saturday.sh run moves to
# SUNDAY, so a fleet re-backtest has an extra ~24h and can run into the week
# without an actuator reading half-rewritten canonical.
# was Sun 08:00 — research does not read canonical, safe to run earlier
# Empty OnCalendar= first CLEARS the unit's shipped value (systemd list-semantics:
# without the reset this ADDS a second schedule and the unit fires on BOTH days).
[Timer]
OnCalendar=
OnCalendar=Sat *-*-* 08:00:00 America/New_York
