# Guards (operator directive 2026-08-10): contain OOM to this unit's cgroup —
# Saturday 2026-08-08 the finisher's uncapped backtest drove the unit to a
# 5.8G peak and the KERNEL OOM killer took it down box-wide — and retry into
# the week (max 3, RTH-avoiding) instead of dying silently until the next
# weekend. The retry template lives at openclaw-research-retry@.service.
[Unit]
OnFailure=openclaw-research-retry@%n.service

[Service]
MemoryMax=5G
MemorySwapMax=0
