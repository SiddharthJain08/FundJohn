# FundJohn user dashboard reverse proxy — :80 -> node server.js on :3000.
# The SSE settings (proxy_buffering off + 24h read timeout) are load-bearing
# for the dashboard's live event stream; do not remove them.
#
# Install:
#   sudo cp docs/nginx/openclaw.conf /etc/nginx/sites-available/openclaw
#   sudo ln -sf /etc/nginx/sites-available/openclaw /etc/nginx/sites-enabled/openclaw
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        # SSE support
        proxy_buffering off;
        proxy_read_timeout 24h;
    }
}
